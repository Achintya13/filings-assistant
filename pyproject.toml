[project]
name = "filings-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Achintya Mengi", email = "am557@st-andrews.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "numpy>=2.5.4",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "voyageai>=0.5.0",
]

[project.scripts]
filings-assistant = "filings_assistant:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
